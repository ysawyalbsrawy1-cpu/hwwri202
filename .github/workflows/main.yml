name: Run Shopify Checker

on:
  workflow_dispatch:

jobs:
  run-checker:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run App in Background
      run: |
        python app.py &
        sleep 10

    - name: Test Store 1 (Cremo - $0.01)
      run: |
        curl "http://127.0.0.1:5000/shopify?site=https://cremo-us.myshopify.com&cc=5556960016096713|11|2027|960&proxy=http://mvzmpajhau-pool-mobile.res.corp-country-US-state-4736286-mode-hold-tier-premium-quality-static-session-6ada32c04cc9e:PE4gCi6EolhyTwLe@212.8.249.142:9999"

